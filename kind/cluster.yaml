# Local cluster used by CI and by scripts/up.sh.
# The default kind CNI does not enforce NetworkPolicy, so it is disabled and
# Calico is installed instead.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hardened
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
