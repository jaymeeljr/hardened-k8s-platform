# Every workload in this namespace must meet the "restricted" Pod Security
# Standard. The API server rejects any pod that runs as root, escalates
# privileges, keeps Linux capabilities or mounts host paths.
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
